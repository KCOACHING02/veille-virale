  adaptations_par_mois: 50      # 4 veilles × 7 + ~22 à la demande
  comptes_surveilles: 10
  studio_par_mois: 20          # carrousels et Reels montés
  veille_auto: true
  budget_usd: 7             # plafond du coût réel (collecte + IA) par mois, en $ : au-delà, plus de nouvelle analyse
  stripe_price: ""

