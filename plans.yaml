# ============================================================
#  Formules d'abonnement — prix et quotas À AJUSTER avant lancement
#  stripe_price : identifiant du prix créé dans le tableau de bord Stripe (price_…)
# ============================================================
essai:
  nom: "Essai gratuit"
  prix_mensuel: 0
  duree_jours: 7
  analyses_par_mois: 3          # veilles + analyses de comptes
  adaptations_par_mois: 35      # publications adaptées (une veille en consomme 7)
  comptes_surveilles: 5
  comptes_perso: false          # veille = bibliothèque virale de sa niche (comptes perso : Pro et Agence)
  studio_par_mois: 3           # carrousels et Reels montés
  plans_30j_par_mois: 1          # plans de contenu de 30 jours (8 carrousels en tunnel de vente)
  veille_auto: false
  budget_usd: 3             # plafond du coût réel (collecte + IA) par mois, en $ : au-delà, plus de nouvelle analyse
  boutiques: 1                  # boutiques en lien dans la bio
  stripe_price: ""

# Formule gratuite : tout nouveau compte y démarre (l'essai reste en réserve et ne commence qu'au premier usage d'une
# fonction payante) ; à la fin de l'essai ou après une résiliation, le compte y revient automatiquement.
# Elle ne consomme presque rien : la boutique et les tendances de sa niche en lecture (bibliothèque commune, déjà collectée).
# Tout ce qui fait travailler Claude, Apify ou le montage est réservé aux abonnées.
gratuit:
  nom: "Gratuit"
  prix_mensuel: 0
  gratuit: true
  analyses_par_mois: 3          # classements de comptes, sans adaptation
  adaptations_par_mois: 0
  comptes_surveilles: 3         # comptes par classement
  comptes_perso: false          # pas de collecte de ses propres comptes : tendances de la bibliothèque seulement
  studio_par_mois: 2            # carrousels avec ses propres textes
  plans_30j_par_mois: 0          # plans de contenu de 30 jours (8 carrousels en tunnel de vente)
  veille_auto: false
  ia: false                     # adaptations, assistant, comptes suggérés, écriture par Claude
  montage_reel: false           # montage des Reels (ffmpeg + transcription)
  suivi_publications: false     # relevés automatiques des Reels publiés (Apify)
  sequences_emails: false       # séquences d'e-mails automatiques de la boutique
  tunnels: false                # tunnels de vente de la boutique (quiz-audit, page de vente)
  messages_auto: false          # messages privés automatiques sur Instagram (mot-clé en commentaire)
  filigrane: true               # « Fait avec Virallink » sur les carrousels
  mention_boutique: true        # « Créé avec Virallink » en bas de la boutique
  commission_boutique: 0        # % prélevé sur les ventes de la boutique (ex. 5) — à annoncer dans les CGV avant de l'activer
  budget_usd: 0.5           # plafond du coût réel (collecte + IA) par mois, en $ : au-delà, plus de nouvelle analyse
  boutiques: 1                  # boutiques en lien dans la bio
  stripe_price: ""

