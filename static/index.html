    try {
      const r = await api("/api/boutique/sequence/ecrire", {method: "POST"});
      const res = await attendsTache(r.job, m => { const l = $("#sq-log"); if (l) l.textContent = m; });
      q.emails = res.emails.map(e => ({delai_jours: e.delai_jours, sujet: e.sujet, texte: e.texte, produit: e.produit || ""}));
      await sauveBoutique(true); toast("Ta séquence est écrite : relis-la avant de l'activer"); renduOnglet();
    } catch (e) { toast(e.message); b.disabled = false; b.textContent = "✨ Écrire la séquence avec Virall.ai"; }
  };
}

// ---- QR code de la boutique
function ouvreQR() {
  const d = BQ.page.design;
  const choix = [["#000000", "#FFFFFF", "Noir et blanc"], [d.texte.slice(0, 7), d.fond1.slice(0, 7), "Aux couleurs de ma page"], [d.accent.slice(0, 7), "#FFFFFF", "Couleur d'accent"]];
  let k = 1;
  const rendu = () => {
    const [c, f] = choix[k], q = `c=${encodeURIComponent(c)}&f=${encodeURIComponent(f)}`;
    $("#feuille").innerHTML = `<h2 id="m-titre">Ton QR code</h2><p class="sous">À mettre en story, sur un flyer, ta carte de visite ou ton packaging. Les visites sont comptées dans tes statistiques (source « QR code »).</p>
      <div style="display:grid;place-items:center;margin:8px 0 14px"><img src="/api/boutique/qr.png?${q}" alt="QR code de ta boutique" style="width:min(260px,70vw);border-radius:14px;box-shadow:var(--shadow)"></div>
      <div class="bt-puces" style="justify-content:center">${choix.map(([, , l], i) => `<button data-qr="${i}" aria-pressed="${i === k}">${l}</button>`).join("")}</div>
      <div class="pied-modale" style="margin-top:16px;flex-wrap:wrap"><a class="btn" href="/api/boutique/qr.svg?${q}&dl=1" download>SVG (impression)</a><a class="btn prim" href="/api/boutique/qr.png?${q}&dl=1" download>Télécharger (PNG)</a></div>`;
    $$("[data-qr]").forEach(b => b.onclick = () => { k = +b.dataset.qr; rendu(); });
  };
  rendu(); $("#modale").classList.add("ouvert");
}

// ---- Onglet Statistiques
async function ongletStats(z) {
  z.innerHTML = '<p class="vide">Chargement…</p>';
  let s; try { s = await api("/api/boutique/stats"); } catch (e) { z.innerHTML = `<p class="vide">${esc(e.message)}</p>`; return; }
  const max = Math.max(1, ...s.serie.map(x => x.vues));
  const noms = BQ.page.sources_noms ||= {};
  z.innerHTML = `
    <div class="bt-kpis">
      <div class="bt-kpi"><b>${s.vues_30j}</b><span>visites (30 jours)</span></div>
      <div class="bt-kpi"><b>${s.clics_total}</b><span>clics sur tes liens</span></div>
      <div class="bt-kpi"><b>${s.ventes}</b><span>ventes</span></div>
      <div class="bt-kpi"><b>${euros(s.chiffre).replace("Gratuit", "0 €")}</b><span>chiffre d'affaires</span></div>
      <div class="bt-kpi"><b>${s.inscrits}</b><span>e-mails récoltés</span></div>
    </div>
    <section class="bt-sec"><h3>Visites des 30 derniers jours</h3><p class="aide">${s.vues_7j} cette semaine. Tes propres visites ne sont pas comptées.</p>
      <div class="bt-barres">${s.serie.map(x => `<i style="height:${Math.round(x.vues / max * 100)}%" title="${new Date(x.jour).toLocaleDateString("fr-FR", {day: "numeric", month: "short"})} : ${x.vues} visite${x.vues > 1 ? "s" : ""}"></i>`).join("")}</div></section>
    <section class="bt-sec"><h3>D'où viennent tes ventes</h3><p class="aide">Chaque Reel, story ou e-mail peut avoir son lien suivi : tu vois lequel ramène des visites, des inscrites et des ventes.</p>
      ${s.sources.length ? `<div class="bt-table"><div class="t"><span>Source</span><span>Visites</span><span>Inscrites</span><span>Ventes</span><span>CA</span></div>${s.sources.map(x => `<div><span>${esc(x.nom)}</span><span>${x.vues || 0}</span><span>${x.inscrits || 0}</span><span>${x.ventes || 0}</span><b>${euros(x.ca || 0).replace("Gratuit", "—")}</b></div>`).join("")}</div>` : '<p class="aide">Pas encore de visite par un lien suivi.</p>'}
      <p class="bt-sous-titre">Créer un lien suivi</p>
      <div class="bt-rangee"><input id="src-nom" placeholder="Ex. Story du 20 octobre" style="flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface)"><button class="btn prim" id="src-cree">Créer le lien</button></div>
      <div id="src-res"></div>
      <div class="bt-rangee" style="margin-top:12px"><button class="btn petit" id="src-qr">QR code de ma boutique</button></div></section>
    <section class="bt-sec"><h3>Liens les plus cliqués</h3>${s.clics.map(x => `<div class="bt-ligne"><span>${esc(x.titre)}</span><b>${x.clics}</b></div>`).join("") || '<p class="aide" style="margin:0">Pas encore de clic.</p>'}</section>
    <section class="bt-sec"><h3>Produits les plus vus</h3>${s.produits.map(x => `<div class="bt-ligne"><span>${esc(x.titre)}</span><b>${x.vues} vue${x.vues > 1 ? "s" : ""}</b></div>`).join("") || '<p class="aide" style="margin:0">Pas encore de visite sur tes produits.</p>'}</section>
    <section class="bt-sec"><h3>Dernières ventes et téléchargements</h3>${s.dernieres_ventes.map(v => `<div class="bt-ligne"><span>${esc(v.produit)} · <small style="color:var(--ink-3)">${esc(v.email || "")}</small></span><b>${euros(v.montant)}</b></div>`).join("") || '<p class="aide" style="margin:0">Rien pour l\'instant.</p>'}</section>
    <section class="bt-sec"><h3>E-mails récoltés <a class="btn petit" href="/api/boutique/inscrits.csv" style="margin-left:auto" download>Exporter (CSV)</a></h3>
      <p class="aide">À importer dans ton outil d'e-mailing (Brevo, Systeme.io, MailerLite…).</p>
      ${s.derniers_inscrits.slice(0, 12).map(x => `<div class="bt-ligne"><span>${esc(x.email)}${x.prenom ? " · " + esc(x.prenom) : ""}</span><small style="color:var(--ink-3)">${new Date(x.date).toLocaleDateString("fr-FR")}</small></div>`).join("") || '<p class="aide" style="margin:0">Aucun inscrit pour l\'instant.</p>'}</section>`;
  $("#src-qr").onclick = ouvreQR;
  $("#src-cree").onclick = async () => {
    const nom = $("#src-nom").value.trim(); if (!nom) return toast("Donne un nom à ton lien");
    const slug = nom.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 36) || "lien";
    noms[slug] = nom; await sauveBoutique(true);
    const url = `${BQ.etat.url}?src=${slug}`;
    $("#src-res").innerHTML = `<div class="carte copiable" style="margin-top:10px">${esc(url)}<button class="btn petit copier" data-copier="${esc(url)}">Copier</button></div>`;
  };
}

// ---- Dans le tiroir d'un Reel adapté : relier le CTA à un produit de la boutique
async function remplitLienBoutique(cle) {
  const z = $("#t-boutique"); if (!z) return;
  if (!S.etat.boutique) { z.innerHTML = `<div class="bt-tiroir"><b>🛍️ Ta boutique en lien dans la bio</b><span>Crée-la pour envoyer un lien qui vend en DM, et savoir quels Reels rapportent.</span><button class="btn petit prim" onclick="fermeTiroir();va('boutique')">Créer ma boutique</button></div>`; return; }
  try { if (!BQ.etat) await chargeBoutique(); } catch { return; }
  const p = S.analyse?.posts.find(x => x.cle === cle), prods = (BQ.page?.produits || []).filter(x => x.visible !== false);
  if (!$("#t-boutique")) return;
  if (!prods.length) { z.innerHTML = `<div class="bt-tiroir"><b>🛍️ Relie ce Reel à un produit</b><span>Ajoute d'abord un produit dans ta boutique.</span><button class="btn petit" onclick="fermeTiroir();BQ.onglet='produits';va('boutique')">Ajouter un produit</button></div>`; return; }
  const src = "reel-" + cle.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(-24).replace(/^-/, "");
  const choisi = BQ.lienReel?.[cle] || prods.find(x => x.mot_cle)?.id || prods[0].id;
  const rendu = id => {
    const pr = prods.find(x => x.id === id) || prods[0];
    const url = `${BQ.etat.url}/p/${pr.id}?src=${src}`;
    const cta = pr.mot_cle ? `Commente « ${pr.mot_cle} » et je t'envoie ${pr.prix ? "le lien" : "le guide gratuit"} en privé 💌` : "";
    z.innerHTML = `<h3>Le lien à envoyer en DM</h3>
      <select class="select" id="t-prod" style="width:100%;margin-bottom:8px">${prods.map(x => `<option value="${x.id}" ${x.id === pr.id ? "selected" : ""}>${esc(x.titre || "Sans titre")} · ${euros(x.prix)}</option>`).join("")}</select>
      ${copiable(url)}<p class="aide" style="margin:4px 0 10px">Lien suivi : les visites et ventes venues de ce Reel apparaissent dans les statistiques de ta boutique.</p>
      ${cta ? `<h3>Appel à l'action avec le mot-clé</h3>${copiable(cta)}` : `<p class="aide">Astuce : donne un mot-clé à ce produit (Produits → Booster les ventes) pour un CTA « Commente … ».</p>`}`;
    $("#t-prod").onchange = e => { BQ.lienReel = {...(BQ.lienReel || {}), [cle]: e.target.value}; rendu(e.target.value); };
    const nom = "Reel · " + ((p?.adaptation?.hook_viral || p?.legende || cle).slice(0, 50));
    if ((BQ.page.sources_noms ||= {})[src] !== nom) { BQ.page.sources_noms[src] = nom; api("/api/boutique", {method: "PUT", body: {sources_noms: BQ.page.sources_noms}}).catch(() => {}); }
  };
  rendu(choisi);
}

// ---- Onglet Kit média
function ongletKit(z) {
  const p = BQ.page, k = p.kit ||= {actif: true, tarifs: [], chiffres_perso: []}, c = BQ.etat.kit_chiffres;
  k.tarifs ||= []; k.chiffres_perso ||= [];
  const kf = n => n == null ? null : n >= 1e6 ? (n / 1e6).toFixed(1).replace(".", ",") + " M" : n >= 1000 ? (n / 1000).toFixed(1).replace(".", ",") + " k" : String(n);
  const tuiles = c ? [[kf((c.abonnes_instagram || 0) + (c.abonnes_tiktok || 0)) , "Abonnés au total"], [kf(c.abonnes_instagram), "Instagram"], [kf(c.abonnes_tiktok), "TikTok"],
    [kf(c.vues_mediane), "Vues médianes"], [c.engagement ? (c.engagement * 100).toFixed(1).replace(".", ",") + " %" : null, "Engagement"]].filter(([v]) => v && v !== "0") : [];
  const aBloc = p.blocs.some(b => b.type === "kit");
  z.innerHTML = `
    <section class="bt-sec"><h3>Ton kit média</h3><p class="aide">Une page pour les marques : ton audience, tes meilleurs contenus et tes tarifs. Adresse : <a href="${esc(BQ.etat.url)}/kit" target="_blank" rel="noopener">${esc(BQ.etat.url.replace(/^https?:\/\//, ""))}/kit</a></p>
      <label class="bt-interr"><span>Kit média en ligne</span><input type="checkbox" data-k="actif" ${k.actif !== false ? "checked" : ""}></label>
      ${aBloc ? "" : `<button class="btn petit" id="kit-bloc" style="margin-top:6px">+ Ajouter le lien du kit sur ma page</button>`}
    </section>
    <section class="bt-sec"><h3>Tes chiffres</h3>
      ${c ? `<p class="aide">Calculés automatiquement à partir de l'analyse de ton compte${c.date ? " du " + new Date(c.date).toLocaleDateString("fr-FR") : ""}. Relance l'analyse dans Réglages pour les mettre à jour.</p>
        <div class="bt-kit-chiffres">${tuiles.map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join("")}</div>`
        : `<p class="aide">Analyse ton compte dans <a href="#" onclick="va('parametres');return false">Réglages → Mon profil</a> : tes abonnés, vues et engagement s'afficheront ici automatiquement.</p>`}
      <p class="bt-sous-titre">Chiffres en plus (facultatif)</p>
      <div class="bt-paires">${k.chiffres_perso.map((x, i) => `<div class="bt-paire"><input data-kl="chiffres_perso:${i}:libelle" value="${esc(x.libelle)}" placeholder="Audience féminine"><input data-kl="chiffres_perso:${i}:valeur" value="${esc(x.valeur)}" placeholder="87 %"><button class="icone-btn" data-kl-suppr="chiffres_perso:${i}" aria-label="Retirer">✕</button></div>`).join("")}</div>
      <button class="btn petit" data-kl-ajout="chiffres_perso" style="margin-top:8px">+ Un chiffre</button>
    </section>
    <section class="bt-sec"><h3>Présentation</h3>
      <div class="champ"><label>À propos</label><textarea data-k="a_propos" maxlength="1500" placeholder="Qui tu es, ton audience, ce que tu proposes aux marques…">${esc(k.a_propos || "")}</textarea></div>
      <div class="champ"><label>Marques avec qui tu as travaillé</label><input data-k="marques" value="${esc(k.marques || "")}" maxlength="600" placeholder="Séphora, Nature & Découvertes…"></div>
      <div class="champ"><label>E-mail pour les collaborations</label><input data-k="contact" type="email" value="${esc(k.contact || "")}" placeholder="collab@ton-site.fr"></div>
    </section>
    <section class="bt-sec"><h3>Tarifs</h3><p class="aide">Facultatif : tes prestations et leurs prix.</p>
      <div class="bt-paires">${k.tarifs.map((x, i) => `<div class="bt-paire"><input data-kl="tarifs:${i}:libelle" value="${esc(x.libelle)}" placeholder="1 Reel + 3 stories"><input data-kl="tarifs:${i}:prix" value="${esc(x.prix)}" placeholder="350 €"><button class="icone-btn" data-kl-suppr="tarifs:${i}" aria-label="Retirer">✕</button></div>`).join("")}</div>
      <button class="btn petit" data-kl-ajout="tarifs" style="margin-top:8px">+ Une prestation</button>
    </section>`;
  lieChamps(z);
  z.querySelectorAll("[data-kl-ajout]").forEach(b => b.onclick = () => { k[b.dataset.klAjout].push({libelle: "", valeur: "", prix: ""}); renduOnglet(); });
  z.querySelectorAll("[data-kl-suppr]").forEach(b => b.onclick = () => { const [l, i] = b.dataset.klSuppr.split(":"); k[l].splice(+i, 1); modifieBoutique(true); });
  $("#kit-bloc")?.addEventListener("click", () => { p.blocs.push({id: idCourt(), type: "kit", titre: "Kit média", texte: "Mes chiffres et collaborations", visible: true}); modifieBoutique(true); toast("Lien ajouté en bas de ta page"); });
}

// ---------------------------------------------------------------- Démarrage
(async () => {
  const q = new URLSearchParams(location.search);
  await Promise.all([chargeEtat(), chargePubs()]); await chargeListe(); va("accueil", true); history.replaceState({vue: "accueil"}, "", location.pathname);
  if (q.get("paiement") === "ok") { toast("Merci, ton abonnement est actif"); va("abonnement"); }
  if (q.get("stripe")) { await chargeBoutique(true); BQ.onglet = "produits"; va("boutique"); toast(BQ.page?.stripe?.pret ? "Stripe est relié : tu peux vendre" : "Inscription Stripe à terminer"); }
  if (q.get("projet")) ouvreProjet(q.get("projet")).catch(() => toast("Ce contenu n'existe plus."));  // lien de l'e-mail « contenu prêt »
  else if (!S.etat.utilisateur.onboarding) ouvreAssistant(0);
  majBoutonInstall();
})();
</script>
