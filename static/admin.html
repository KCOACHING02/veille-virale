<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration — Virallink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F6F4F8;--surface:#fff;--sunk:#EDE9F1;--ink:#271B2D;--ink-2:#5E5166;--ink-3:#8E8296;--line:#E2DCE7;--glow:#FF4F79;--glow-soft:#FFE3EA;--ok:#13936B;--ok-soft:#DDF4EB;--warn:#B86E00;--warn-soft:#FDF0D9;
  --shadow:0 1px 2px rgba(39,27,45,.06),0 8px 24px -12px rgba(39,27,45,.18);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#17111B;--surface:#211A26;--sunk:#2B2231;--ink:#F3EEF6;--ink-2:#C2B7C9;--ink-3:#8F8398;--line:#352B3B;--glow:#FF5C84;--glow-soft:#3E1F2A;--ok:#3CC796;--ok-soft:#163328;--warn:#F0A63A;--warn-soft:#3A2A12}}
*{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:14.5px/1.5 var(--body)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.page{max-width:1200px;margin:0 auto;padding:24px 16px 60px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font:800 28px/1.1 var(--display);font-stretch:85%;margin:0 auto 0 0}
a{color:inherit}
.btn{text-decoration:none;display:inline-block}
td.num{white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.petit{padding:4px 9px;font-size:12.5px;border-radius:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi b{display:block;font:800 26px/1.1 var(--display);font-stretch:85%}
.kpi span{color:var(--ink-3);font-size:13px}
.config{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.puce{border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:600;background:var(--ok-soft);color:var(--ok)}
.puce.non{background:var(--warn-soft);color:var(--warn)}
.outils{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.outils input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;flex:1;min-width:200px}
.tableau{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-weight:600}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.qui b{display:block} .qui small{color:var(--ink-3)}
.statut{font-size:12px;font-weight:600;border-radius:99px;padding:2px 8px;background:var(--sunk);color:var(--ink-2)}
.statut.actif{background:var(--ok-soft);color:var(--ok)} .statut.fin{background:var(--warn-soft);color:var(--warn)}
select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 6px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.cher{color:var(--warn);font-weight:600}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;transition:transform .25s;max-width:calc(100% - 32px)}
#toast.vu{transform:translateX(-50%)}
.lien{word-break:break-all;background:var(--sunk);border-radius:10px;padding:10px 12px;margin:0 0 14px;font-size:13px}
/* iPhone : Safari zoome sur tout champ dont le texte fait moins de 16 px (et la page reste zoomée) */
@media (max-width:860px),(pointer:coarse){
  input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]):not([type=file]),select,textarea{font-size:16px !important}
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
h2{font:800 22px/1.2 var(--display);font-stretch:85%;margin:32px 0 6px}
.sous{color:var(--ink-2);margin:0 0 12px}
.niches{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.niche{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px}
.niche h3{margin:0 0 2px;font-size:16px} .niche .f{color:var(--ink-3);font-size:12.5px;margin-bottom:8px}
.niche textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);font:13px/1.4 ui-monospace,monospace;resize:vertical}
.cpt{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 8px}
.cpt span{font-size:12px;border-radius:99px;padding:2px 8px;background:var(--sunk)}
.cpt span.ok{background:var(--ok-soft);color:var(--ok)} .cpt span.ko{background:var(--warn-soft);color:var(--warn);text-decoration:line-through}
#bib-job{font-size:13px;color:var(--ink-2)}
.services{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.serv{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;border-left:5px solid var(--line)}
.serv.ok{border-left-color:var(--ok)} .serv.alerte{border-left-color:var(--warn)} .serv.ko{border-left-color:#D93A3A} .serv.absent{border-left-color:var(--ink-3)}
.serv h3{margin:0;font-size:15.5px;display:flex;justify-content:space-between;gap:8px} .serv .role{color:var(--ink-3);font-size:12.5px;margin-bottom:6px}
.serv p{margin:4px 0;font-size:13.5px} .serv .conseil{color:var(--ink-2)}
</style>
</head>
<body>
<div class="page">
  <header><h1>Administration</h1><a class="btn" href="/app">Retour à l'application</a></header>
  <div class="kpis" id="kpis"></div>
  <div class="kpis" id="croissance"></div>
  <div class="config" id="config"></div>
  <div id="lien"></div>
  <section id="services"></section>
  <section id="bib"></section>
  <h2>Clientes</h2>
  <div class="outils"><input id="q" type="search" placeholder="Rechercher un client (e-mail, prénom)…" aria-label="Rechercher un client"></div>
  <div class="tableau"><table><thead><tr><th>Client</th><th>Formule</th><th>Statut</th><th>Inscrit</th><th>Dernière connexion</th><th class="num">Analyses (mois)</th><th class="num">Adaptations (mois)</th><th class="num">Coût mois</th><th class="num">Coût total</th><th class="num">Payé/mois</th><th>Actions</th></tr></thead><tbody id="lignes"></tbody></table></div>
</div>
<div id="toast" role="status"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const d = s => s ? new Date(s).toLocaleDateString("fr-FR", {day: "numeric", month: "short", year: "2-digit"}) : "—";
const usd = x => (x || 0).toLocaleString("fr-FR", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " $";
const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("vu"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("vu"), 2200); };
let D = null;
async function charge() {
  const r = await fetch("/api/admin");
  if (!r.ok) { document.body.innerHTML = "<p style='padding:24px'>Accès réservé.</p>"; return; }
  D = await r.json();
  const k = D.kpi;
  $("#kpis").innerHTML = [[k.clients, "clients inscrits"], [k.payants, "clients payants"], [k.essais, `essais en cours · ${k.essais_reserve || 0} pas encore démarrés`],
    [k.mrr.toLocaleString("fr-FR") + " €", "revenu mensuel (abonnements actifs)"], [usd(k.cout_mois_usd), "coût Apify + Claude ce mois-ci"],
    ...(D.serveur?.total_mo ? [[`${(D.serveur.utilise_mo / 1024).toLocaleString("fr-FR", {maximumFractionDigits: 1})} / ${(D.serveur.total_mo / 1024).toLocaleString("fr-FR", {maximumFractionDigits: 1})} Go`, `disque utilisé${D.serveur.libre_mo < 300 ? " ⚠️ presque plein" : ""}${D.serveur.nettoyage?.date ? ` · nettoyage auto le ${new Date(D.serveur.nettoyage.date).toLocaleDateString("fr-FR")} : ${D.serveur.nettoyage.mo.toLocaleString("fr-FR")} Mo libérés` : ""}`],
      [`${(D.serveur.memoire_mo / 1024).toLocaleString("fr-FR", {maximumFractionDigits: 1})} Go`, `mémoire du serveur${D.serveur.memoire_mo <= 2048 ? " (petite machine : vidéos traitées une par une)" : ""}`]] : [])]
    .map(([v, l]) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join("");
  const g = D.croissance || {};
  $("#croissance").innerHTML = [[g.conversion == null ? "—" : g.conversion + " %", "des inscrites depuis 14 j+ ont déjà payé"],
    [g.inactives, "clientes inactives depuis 14 jours"], [g.resilies, "abonnements résiliés"], [g.parrainages, "inscriptions par parrainage"],
    [g.boutiques, "boutiques en ligne"], [(g.ca_boutiques || 0).toLocaleString("fr-FR") + " €", `vendus par les boutiques (${g.ventes_boutiques || 0} ventes)`],
    [(g.boutique_gratuite || {}).inscrites || 0, `inscrites par la boutique gratuite : ${(g.boutique_gratuite || {}).essais || 0} ont démarré leur essai, ${(g.boutique_gratuite || {}).abonnees || 0} abonnées`]]
    .map(([v, l]) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join("");
  const c = D.config;
  $("#config").innerHTML = [["Apify", c.apify], ["Claude", c.claude], ["Paiement Stripe", c.stripe], ["E-mails Resend", c.emails], ["Banque d'images", c.banque]]
    .map(([n, ok]) => `<span class="puce ${ok ? "" : "non"}">${ok ? "✓" : "✗"} ${n}</span>`).join("") + (c.demo ? '<span class="puce non">Mode démo</span>' : "");
  rendu();
}
function rendu() {
  const q = $("#q").value.trim().toLowerCase();
  const plans = Object.entries(D.plans);
  $("#lignes").innerHTML = D.clients.filter(c => !q || (c.email + " " + (c.prenom || "")).toLowerCase().includes(q)).map(c => `
    <tr data-id="${c.id}">
      <td class="qui"><b>${esc(c.prenom || "—")}${c.admin ? " · admin" : ""}</b><small>${esc(c.email)}</small>${c.job ? `<br><small>⏳ ${esc(c.job)}</small>` : ""}
        ${c.inactive ? '<br><span class="statut fin">inactive</span>' : ""}${c.parrain ? `<br><small>parrainée par ${esc(c.parrain)}</small>` : ""}${c.filleules ? `<br><small>💌 ${c.filleules} filleule${c.filleules > 1 ? "s" : ""}</small>` : ""}</td>
      <td><select data-champ="plan" aria-label="Formule">${plans.map(([id, nom]) => `<option value="${id}" ${id === c.plan ? "selected" : ""}>${esc(nom)}</option>`).join("")}</select></td>
      <td><select data-champ="statut" aria-label="Statut">${["gratuit", "essai", "actif", "impaye", "resilie", "suspendu"].map(s => `<option ${s === c.statut ? "selected" : ""}>${s}</option>`).join("")}</select>
        <br><span class="statut ${c.actif ? "actif" : "fin"}">${c.actif ? "accès ouvert" : "accès fermé"}</span>${c.statut === "essai" ? `<br><small>fin d'essai ${d(c.fin_essai)}</small>` : c.essai_dispo ? "<br><small>essai en réserve</small>" : ""}</td>
      <td>${d(c.cree)}</td><td>${d(c.derniere_connexion)}</td>
      <td class="num">${c.analyses_mois}</td><td class="num">${c.adaptations_mois}</td>
      <td class="num ${c.prix && c.cout_mois * 0.95 > c.prix * 0.5 ? "cher" : ""}">${usd(c.cout_mois)}</td><td class="num">${usd(c.cout_total)}</td>
      <td class="num">${c.prix ? c.prix + " €" : "—"}</td>
      <td><div class="actions"><button class="btn petit" data-action="prolonger">+7 j d'essai</button><button class="btn petit" data-action="mdp">Lien mot de passe</button>${c.inactive ? '<button class="btn petit" data-action="relance">Relancer</button>' : ""}</div></td>
    </tr>`).join("") || '<tr><td colspan="11">Aucun client.</td></tr>';
}
async function modifie(id, corps) {
  const r = await fetch("/api/admin/clients/" + id, {method: "PATCH", headers: {"Content-Type": "application/json"}, body: JSON.stringify(corps)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) return toast("Erreur");
  if (j.lien) $("#lien").innerHTML = `<p class="lien">Lien de nouveau mot de passe (valable 48 h), à envoyer au client :<br><b>${esc(j.lien)}</b></p>`;
  toast("Enregistré"); charge();
}
$("#lignes").addEventListener("change", e => { const s = e.target.closest("select"); if (s) modifie(s.closest("tr").dataset.id, {[s.dataset.champ]: s.value}); });
$("#lignes").addEventListener("click", e => {
  const b = e.target.closest("[data-action]"); if (!b) return;
  const id = b.closest("tr").dataset.id;
  if (b.dataset.action === "relance") {
    fetch("/api/admin/clients/" + id + "/relance", {method: "POST"}).then(r => r.json().then(j => toast(r.ok ? "Relance envoyée (e-mail + notification)" : j.erreur || "Erreur")));
    return;
  }
  modifie(id, b.dataset.action === "prolonger" ? {prolonger_jours: 7} : {lien_mdp: true});
});
$("#q").addEventListener("input", rendu);
charge();

// ---- Bibliothèque virale par niche
let B = null;
const nb = x => x == null ? "—" : x >= 1e6 ? (x / 1e6).toLocaleString("fr-FR", {maximumFractionDigits: 1}) + " M" : x >= 1e3 ? Math.round(x / 1e3) + " k" : x;
async function chargeBib() {
  const r = await fetch("/api/admin/bibliotheque"); if (!r.ok) return;
  B = await r.json(); renduBib();
}
setInterval(() => { if ((B?.taches || []).some(t => ["en cours", "en attente"].includes(t.statut))) chargeBib(); }, 15000);
function renduBib() {
  const e = B.etat || {}, j = e.journal || [], m = j.slice(0, 30).reduce((a, x) => a + (x.cout_usd || 0), 0);
  const pf = e.par_format || {};
  $("#bib").innerHTML = `<h2>Bibliothèque virale</h2>
    <p class="sous">Une collecte Instagram par jour pour toutes les clientes. Viral = publiée depuis 48 h à 3 mois, au moins ${B.multiple}× l'habitude de son compte, et
      Reel ≥ ${nb(B.regles.Reel.vues_min)} vues et ${Math.round(B.regles.Reel.engagement_min * 100)} % d'engagement · Carrousel ≥ ${nb(B.regles.Carrousel.jaime_min)} j'aime · Publication ≥ ${nb(B.regles.Photo.jaime_min)} j'aime.</p>
    <div class="kpis">${[[e.total || 0, `publications virales (${pf.Carrousel || 0} carrousels, ${pf.Reel || 0} Reels, ${pf.Photo || 0} publications), dont ${e.prets || 0} prêtes pour les clientes`],
      [e.jour ? new Date(e.fin || e.jour).toLocaleString("fr-FR", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"}) : "jamais", "dernière actualisation"],
      [usd(e.cout_usd), "coût de la dernière collecte"], [usd(m), `coût des ${Math.min(j.length, 30)} derniers jours`]]
      .map(([v, l]) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join("")}</div>
    ${(B.taches || []).map(t => `<p class="sous">${["en cours", "en attente"].includes(t.statut) ? "⏳" : t.statut === "erreur" ? "🔴" : "✓"} <b>${esc(t.titre)}</b> (lancée à ${esc((t.debut || "").slice(11, 16))}) : ${esc(t.statut)}${t.erreur ? " — " + esc(t.erreur) : t.dernier ? " — " + esc(t.dernier) : ""}</p>`).join("")}
    <div class="outils"><button class="btn" id="bib-maj">Actualiser maintenant</button><button class="btn" id="bib-verif">Vérifier les comptes</button><button class="btn" id="bib-sauve">Enregistrer les listes</button><span id="bib-job"></span></div>
    <div class="niches">${Object.entries(B.niches).map(([k, n]) => `<div class="niche" data-niche="${esc(k)}">
      <h3>${esc(n.nom)}</h3><div class="f">${n.par_format.Carrousel} carrousels · ${n.par_format.Reel} Reels · ${n.par_format.Photo} publications · ${n.comptes.length} comptes</div>
      <div class="cpt">${n.comptes.map(c => `<span class="${c.ok === true ? "ok" : c.ok === false ? "ko" : ""}" title="${c.introuvable ? "introuvable" : c.prive ? "privé" : c.abonnes ? nb(c.abonnes) + " abonnés" : "non vérifié"}${c.lus != null ? " · " + c.lus + " publications lues" : ""}${c.viraux ? " · " + c.viraux + " virales" : ""}">@${esc(c.compte)}${c.abonnes ? " · " + nb(c.abonnes) : ""}${c.viraux ? " · 🔥" + c.viraux : ""}</span>`).join("")}</div>
      <textarea aria-label="Comptes de la niche ${esc(n.nom)}, un par ligne">${n.comptes.map(c => c.compte).join("\n")}</textarea></div>`).join("")}</div>`;
  $("#bib-sauve").onclick = async () => {
    const niches = {};
    document.querySelectorAll("[data-niche]").forEach(el => { const k = el.dataset.niche, n = B.niches[k];
      niches[k] = {nom: n.nom, mots: n.mots, comptes: el.querySelector("textarea").value.split(/[\s,]+/).filter(Boolean)}; });
    const r = await fetch("/api/admin/bibliotheque", {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify({niches})});
    toast(r.ok ? "Listes enregistrées" : "Erreur"); chargeBib();
  };
  const tache = async (url, quoi) => {
    const r = await fetch(url, {method: "POST"}); const x = await r.json().catch(() => ({}));
    if (!r.ok) return toast(x.erreur || "Erreur");
    const suit = async () => {
      const t = await (await fetch("/api/jobs/" + x.job)).json().catch(() => null); if (!t) return;
      $("#bib-job").textContent = `${quoi} : ${t.statut}${t.logs?.length ? " — " + t.logs[t.logs.length - 1].m : ""}`;
      if (["en cours", "en attente"].includes(t.statut)) setTimeout(suit, 3000); else { if (t.erreur) toast(t.erreur); chargeBib(); }
    };
    suit();
  };
  $("#bib-maj").onclick = () => tache("/api/admin/bibliotheque/actualise", "Actualisation");
  $("#bib-verif").onclick = () => tache("/api/admin/bibliotheque/verifie", "Vérification");
}
chargeBib();

// ---- Services payants : crédit et clés
const ETATS = {ok: "✓ OK", alerte: "⚠️ À surveiller", ko: "🔴 Bloqué", absent: "— Non configuré", info: "ℹ️ À vérifier soi-même"};
async function chargeServices(force) {
  $("#services").innerHTML = `<h2>Services</h2><p class="sous">${force ? "Vérification en cours…" : "Chargement…"}</p>`;
  const r = await fetch("/api/admin/services", {method: force ? "POST" : "GET"}); if (!r.ok) return;
  const x = await r.json();
  $("#services").innerHTML = `<h2>Services</h2>
    <p class="sous">Crédit et clés des services dont Virallink dépend. Vérifié chaque matin à 8 h : un e-mail t'est envoyé s'il y a un risque d'interruption.
      Dernière vérification : ${x.le ? new Date(x.le).toLocaleString("fr-FR", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"}) : "—"}.
      <button class="btn petit" id="serv-maj">Vérifier maintenant</button></p>
    <div class="services">${(x.services || []).map(v => `<div class="serv ${v.etat}"><h3><span>${esc(v.nom)}</span><span>${ETATS[v.etat] || v.etat}</span></h3>
      <div class="role">${esc(v.role)}</div><p>${esc(v.detail)}</p>${v.conseil ? `<p class="conseil">${esc(v.conseil)}</p>` : ""}
      ${v.lien ? `<p><a href="${esc(v.lien)}" target="_blank" rel="noopener">Ouvrir ${esc(v.nom.split(" (")[0])} ↗</a></p>` : ""}</div>`).join("")}</div>`;
  $("#serv-maj").onclick = () => chargeServices(true);
}
chargeServices();
</script>
</body>
</html>
