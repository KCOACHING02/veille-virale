# Utilisation PERSONNELLE en ligne de commande (sans l application web) : veille chaque lundi à 7h
name: Virallink hebdo
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}   # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write         # pour enregistrer historique.json et les rapports dans le dépôt

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - name: Cache du modèle de transcription
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-models
      - run: python veille.py
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Enregistrer historique et rapports
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add -f historique.json rapports/veille_* config.yaml suivi/
          git commit -m "Veille du $(date +%F)" || echo "Rien à enregistrer"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: rapport-veille
          path: |
            rapports/veille_*.html
            rapports/veille_*.xlsx
